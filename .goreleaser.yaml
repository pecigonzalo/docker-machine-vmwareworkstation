version: 2

before:
  hooks:
    - go mod download

builds:
  - main: ./cmd
    binary: docker-machine-driver-vmwareworkstation
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
