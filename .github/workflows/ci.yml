name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # golangci-lint is pinned in tools/go.mod (updated by Dependabot).
      - run: go tool -modfile=tools/go.mod golangci-lint run ./...

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Builds with the same config as the release, which also validates it.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - uses: actions/upload-artifact@v7
        with:
          name: docker-machine-driver-vmwareworkstation-windows-amd64
          path: dist/*/docker-machine-driver-vmwareworkstation.exe
          retention-days: 7
